<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语言整理工具 · Lang Sort Tool</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --border: #e3e6ee;
    --text: #1f2430;
    --muted: #7a8194;
    --accent: #5b6cff;
    --accent-dark: #4453e0;
    --ok: #1faa6a;
    --chip: #eef0fb;
    --row-alt: #fafbff;
    --shadow: 0 1px 3px rgba(20, 28, 60, .06), 0 8px 24px rgba(20, 28, 60, .05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; }
  .main { flex: 1; min-width: 0; }
  .main-inner { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }

  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-top: 18px;
  }

  details.input { padding: 0; }
  details.input > summary {
    cursor: pointer; list-style: none; padding: 14px 18px;
    font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px;
  }
  details.input > summary::-webkit-details-marker { display: none; }
  details.input > summary .chev { transition: transform .15s; color: var(--muted); }
  details.input[open] > summary .chev { transform: rotate(90deg); }
  .input-body { padding: 0 18px 16px; }
  textarea {
    width: 100%; min-height: 200px; resize: vertical;
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 12.5px; line-height: 1.55; color: var(--text); background: #fcfcff;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,108,255,.12); }

  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  button {
    font: inherit; font-size: 13px; cursor: pointer; border-radius: 7px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 7px 13px; transition: background .12s, border-color .12s, color .12s, transform .05s;
  }
  button:hover { background: #f3f4fb; border-color: #cfd4e6; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.ghost { background: transparent; }
  button.copied { background: var(--ok) !important; border-color: var(--ok) !important; color: #fff !important; }

  /* 左侧时间线 */
  .sidebar {
    width: 300px; flex: 0 0 300px; align-self: flex-start;
    position: sticky; top: 0; height: 100vh;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sb-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .sb-title { font-size: 15px; font-weight: 700; }
  .sb-new { margin-left: auto; padding: 6px 12px; }
  .sb-filter { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 12px; border-bottom: 1px solid var(--border); }
  .sb-filter select, .sb-filter input {
    font: inherit; font-size: 13px; width: 100%;
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px;
    background: #fcfcff; color: var(--text);
  }
  .sb-filter select:focus, .sb-filter input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,108,255,.12); }
  .sb-list { flex: 1; overflow-y: auto; padding: 10px 12px 24px; position: relative; }
  .sb-list::before { content: ""; position: absolute; top: 18px; bottom: 18px; left: 23px; width: 2px; background: var(--border); }
  .sb-empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 13px; }

  .tl-item { position: relative; z-index: 1; display: flex; gap: 10px; padding: 11px 8px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; }
  .tl-item:hover { background: #f1f3ff; }
  .tl-item.active { background: #eef0fb; }
  .tl-item.active::after { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent); }
  .tl-dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 5px; box-shadow: 0 0 0 3px var(--panel); }
  .tl-body { flex: 1; min-width: 0; }
  .tl-top { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .tl-code { font-family: "SFMono-Regular", Consolas, monospace; font-weight: 700; color: var(--accent-dark); }
  .tl-name { font-size: 13.5px; font-weight: 600; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-del { flex: 0 0 auto; align-self: center; border: none; background: transparent; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 4px; cursor: pointer; opacity: 0; border-radius: 6px; }
  .tl-item:hover .tl-del { opacity: 1; }
  .tl-del:hover { color: #e0364f; background: #fdeaed; }

  /* 当前活动元信息栏 */
  .metabar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 18px; }
  .metabar .field { display: flex; align-items: center; gap: 7px; }
  .metabar label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .metabar input {
    font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; background: #fcfcff; color: var(--text);
  }
  .metabar input.code-in { width: 120px; font-family: "SFMono-Regular", Consolas, monospace; }
  .metabar input.name { min-width: 180px; }
  .metabar input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,108,255,.12); }
  .metabar .saved-note { font-size: 12px; color: var(--muted); margin-left: auto; }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: auto; flex: none; position: static; height: auto; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--border); }
  }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .toolbar .count { font-size: 13px; color: var(--muted); margin-right: auto; }
  .toolbar .count b { color: var(--text); }
  .toolbar input.filter {
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px;
    font: inherit; font-size: 13px; width: 200px; background: #fcfcff;
  }
  .toolbar input.filter:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,108,255,.12); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: #f3f4fb; text-align: left;
    font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em;
    padding: 11px 16px; border-bottom: 1px solid var(--border); text-transform: uppercase;
  }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  tbody tr:hover td { background: #f1f3ff; }

  td.lang { width: 168px; }
  .code {
    display: inline-block; font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12.5px; font-weight: 600; background: var(--chip); color: var(--accent-dark);
    padding: 2px 8px; border-radius: 6px;
  }
  .name { display: block; margin-top: 5px; font-size: 13px; color: var(--text); }
  .sub {
    display: inline-block; margin-top: 6px; font-size: 10.5px; letter-spacing: .04em;
    color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
  }

  .cell { display: flex; flex-direction: column; gap: 8px; }
  .cell-bar { display: flex; justify-content: flex-end; }
  .cell-text { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .col-tag .cell-text { font-weight: 600; }
  button.copy { padding: 4px 12px; font-size: 12px; border-radius: 6px; }

  .empty { padding: 40px 18px; text-align: center; color: var(--muted); font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .22s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-title">活动时间线</div>
      <button id="newProj" class="primary sb-new">＋ 新建</button>
    </div>
    <div class="sb-filter">
      <select id="projFilter"><option value="">全部项目</option></select>
      <input id="search" placeholder="搜索 ID / 名称…" />
    </div>
    <div class="sb-list" id="timeline"></div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <header>
        <h1>语言整理工具 · Lang Sort Tool</h1>
        <p>把多语言投放文案整理成「语言 / 宣传口号 / 说明」表格，逐行一键复制纯文本（自动去除 <code>[TAGLINE]</code> <code>[DESCRIPTION]</code> <code>[SUBTYPE]</code> 标记）。纯前端解析无需联网；活动按 ID 时间线缓存在本浏览器。</p>
      </header>

      <div class="panel metabar">
        <div class="field">
          <label for="projCode">ID</label>
          <input type="text" id="projCode" class="code-in" placeholder="唯一ID" />
        </div>
        <div class="field">
          <label for="projName">项目</label>
          <input type="text" id="projName" class="name" placeholder="项目名称" />
        </div>
        <div class="field">
          <label for="projDate">日期</label>
          <input type="date" id="projDate" />
        </div>
        <span class="saved-note">✓ 自动缓存到本浏览器</span>
      </div>

      <details class="panel input" open>
    <summary><span class="chev">▶</span> 粘贴 / 编辑原始内容</summary>
    <div class="input-body">
      <textarea id="src" spellcheck="false" placeholder="按 <语言> 分块粘贴即可，三种写法都认：&#10;1) [TAGLINE]...[TAGLINE]  [DESCRIPTION]...[DESCRIPTION]&#10;2) tagline_localized: ...（换行）description_localized: ...&#10;3) 无标记：第一行=口号，第二行=说明"></textarea>
      <div class="btnrow">
        <button class="primary" id="parseBtn">解析生成表格</button>
        <button id="restoreBtn" class="ghost">恢复示例数据</button>
        <button id="clearBtn" class="ghost">清空</button>
        <span class="hint">支持三种格式：<code>[TAGLINE]</code> 方括号、<code>tagline_localized:</code> 键值、或无标记（第一行口号+第二行说明）；编辑后自动重新解析。</span>
      </div>
    </div>
  </details>

  <div class="panel" style="margin-top:18px;">
    <div class="toolbar">
      <span class="count">已识别 <b id="cnt">0</b> 种语言</span>
      <input class="filter" id="filter" placeholder="筛选语言 / 代码…" />
      <button id="copyAllTag">复制全部口号</button>
      <button id="copyAllDesc">复制全部说明</button>
      <button id="copyTable">复制整表 (TSV)</button>
    </div>
    <div id="tableHost">
      <div class="empty">暂无数据，请在上方粘贴内容。</div>
    </div>
  </div>
      </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- 语言名映射（未知代码自动回退为代码本身） ---------- */
const LOCALE_NAMES = {
  "en-US":"English (US)","en-GB":"English (UK)","en-IN":"English (India)",
  "es-US":"Español (US)","es-ES":"Español (España)","es-419":"Español (LatAm)",
  "zh-TW":"繁體中文","zh-CN":"简体中文","ja-JP":"日本語","ko-KR":"한국어",
  "de-DE":"Deutsch","fr-FR":"Français","fr-CA":"Français (CA)",
  "pt-BR":"Português (BR)","pt-PT":"Português (PT)","it-IT":"Italiano",
  "nl-NL":"Nederlands","pl-PL":"Polski","ru-RU":"Русский","tr-TR":"Türkçe",
  "ar-SA":"العربية","hi-IN":"हिन्दी","id-ID":"Bahasa Indonesia",
  "ms-MY":"Bahasa Melayu","th-TH":"ไทย","vi-VN":"Tiếng Việt",
  "fil-PH":"Filipino","kk-KZ":"Қазақша"
};

const state = { items: [], filter: "" };

/* ---------- 解析（兼容多种格式） ---------- */
// 每个字段支持两种写法：
//   1) 方括号标记： [TAGLINE] ... [TAGLINE]
//   2) 键: 值：     tagline_localized: ...（也认 tagline: ...，值可跨行）
const FIELD_DEFS = {
  tagline:     { token: "TAGLINE",     keys: ["tagline_localized", "tagline"] },
  description: { token: "DESCRIPTION", keys: ["description_localized", "description"] },
  subtype:     { token: "SUBTYPE",     keys: ["subtype_localized", "subtype"] }
};
// 所有键按长度降序（避免前缀误判），用于「键: 值」取值时定位下一字段的边界
const ALL_KEYS = Object.values(FIELD_DEFS).flatMap(d => d.keys).sort((a, b) => b.length - a.length);
const KEY_BOUNDARY = ALL_KEYS.join("|");

function extractField(body, def) {
  // 1) 方括号标记：[TOKEN] ... [TOKEN]
  let m = new RegExp("\\[" + def.token + "\\]([\\s\\S]*?)\\[" + def.token + "\\]").exec(body);
  if (m) return m[1].trim();
  // 2) 键: 值：取到下一个已知字段键或文本结尾（值内的冒号会保留）
  for (const key of def.keys) {
    m = new RegExp(
      "(?:^|\\n)[ \\t]*" + key + "[ \\t]*[:：][ \\t]*([\\s\\S]*?)(?=\\n[ \\t]*(?:" + KEY_BOUNDARY + ")[ \\t]*[:：]|$)",
      "i"
    ).exec(body);
    if (m) return m[1].trim();
  }
  return "";
}

function parse(text) {
  const items = [];
  // 匹配 <locale> ... </locale>，用反向引用确保开闭标签一致
  const blockRe = /<([A-Za-z][\w-]*)>([\s\S]*?)<\/\1>/g;
  // 判断块内是否出现过任何标记/键名（用于决定是否启用「按行定位」兜底）
  const markedRe = new RegExp("\\[(?:TAGLINE|DESCRIPTION|SUBTYPE)\\]|(?:^|\\n)[ \\t]*(?:" + KEY_BOUNDARY + ")[ \\t]*[:：]", "i");
  let m;
  while ((m = blockRe.exec(text)) !== null) {
    const locale = m[1];
    const body = m[2];
    let tagline = extractField(body, FIELD_DEFS.tagline);
    let description = extractField(body, FIELD_DEFS.description);
    const subtype = extractField(body, FIELD_DEFS.subtype);
    // 3) 无任何标记/键名：按行定位 —— 第一行作口号，其余作说明
    if (!tagline && !description && !markedRe.test(body)) {
      const lines = body.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (lines.length) {
        tagline = lines[0];
        description = lines.slice(1).join(" ");
      }
    }
    if (!tagline && !description && !subtype) continue; // 跳过非文案块
    items.push({ locale, subtype, tagline, description });
  }
  return items;
}

/* ---------- 工具函数 ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

async function copyText(text) {
  // 优先 Clipboard API；file:// 等非安全上下文回退到 execCommand
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 回退 */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

function flashBtn(btn, label) {
  const old = btn.textContent;
  btn.textContent = label;
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1100);
}

/* ---------- 渲染 ---------- */
function visibleItems() {
  const f = state.filter.trim().toLowerCase();
  if (!f) return state.items;
  return state.items.filter(it => {
    const name = (LOCALE_NAMES[it.locale] || "").toLowerCase();
    return it.locale.toLowerCase().includes(f) || name.includes(f);
  });
}

function render() {
  document.getElementById("cnt").textContent = state.items.length;
  const host = document.getElementById("tableHost");
  const items = visibleItems();

  if (state.items.length === 0) {
    host.innerHTML = '<div class="empty">暂无数据，请在上方粘贴内容。</div>';
    return;
  }
  if (items.length === 0) {
    host.innerHTML = '<div class="empty">没有匹配「' + escapeHtml(state.filter) + '」的语言。</div>';
    return;
  }

  let rows = "";
  items.forEach(it => {
    const i = state.items.indexOf(it);
    const name = LOCALE_NAMES[it.locale] || "";
    rows +=
      '<tr>' +
        '<td class="lang">' +
          '<span class="code">' + escapeHtml(it.locale) + '</span>' +
          (name ? '<span class="name">' + escapeHtml(name) + '</span>' : '') +
          (it.subtype ? '<span class="sub">' + escapeHtml(it.subtype) + '</span>' : '') +
        '</td>' +
        '<td class="col-tag">' +
          '<div class="cell">' +
            '<div class="cell-bar"><button class="copy" data-row="' + i + '" data-field="tagline">复制口号</button></div>' +
            '<div class="cell-text" dir="auto">' + escapeHtml(it.tagline) + '</div>' +
          '</div>' +
        '</td>' +
        '<td class="col-desc">' +
          '<div class="cell">' +
            '<div class="cell-bar"><button class="copy" data-row="' + i + '" data-field="description">复制说明</button></div>' +
            '<div class="cell-text" dir="auto">' + escapeHtml(it.description) + '</div>' +
          '</div>' +
        '</td>' +
      '</tr>';
  });

  host.innerHTML =
    '<table><thead><tr>' +
      '<th>语言 Language</th><th>宣传口号 Tagline</th><th>说明 Description</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

/* ---------- 事件 ---------- */
function doParse() {
  const text = document.getElementById("src").value;
  state.items = parse(text);
  render();
}

let parseTimer = null, saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStore, 400);
}
document.getElementById("src").addEventListener("input", () => {
  activeProj().input = document.getElementById("src").value;
  scheduleSave();
  clearTimeout(parseTimer);
  parseTimer = setTimeout(doParse, 300);
});

document.getElementById("parseBtn").addEventListener("click", doParse);

document.getElementById("restoreBtn").addEventListener("click", () => {
  document.getElementById("src").value = DEFAULT_INPUT;
  activeProj().input = DEFAULT_INPUT;
  saveStore();
  doParse();
  toast("已恢复示例数据");
});

document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("src").value = "";
  activeProj().input = "";
  saveStore();
  state.items = [];
  render();
});

document.getElementById("filter").addEventListener("input", e => {
  state.filter = e.target.value;
  render();
});

// 行内复制（事件委托）
document.getElementById("tableHost").addEventListener("click", async e => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  const it = state.items[Number(btn.dataset.row)];
  if (!it) return;
  const text = btn.dataset.field === "tagline" ? it.tagline : it.description;
  const ok = await copyText(text);
  if (ok) flashBtn(btn, "✓ 已复制"); else toast("复制失败，请手动选择");
});

// 批量复制（始终针对全部已解析数据，TSV 含语言代码，可直接粘贴到表格）
async function bulkCopy(kind, btn) {
  if (state.items.length === 0) { toast("暂无数据"); return; }
  let text;
  if (kind === "tag") {
    text = state.items.map(it => it.locale + "\t" + it.tagline).join("\n");
  } else if (kind === "desc") {
    text = state.items.map(it => it.locale + "\t" + it.description).join("\n");
  } else {
    text = "语言\t宣传口号\t说明\n" +
      state.items.map(it => it.locale + "\t" + it.tagline + "\t" + it.description).join("\n");
  }
  const ok = await copyText(text);
  if (ok) flashBtn(btn, "✓ 已复制"); else toast("复制失败，请手动选择");
}
document.getElementById("copyAllTag").addEventListener("click", e => bulkCopy("tag", e.currentTarget));
document.getElementById("copyAllDesc").addEventListener("click", e => bulkCopy("desc", e.currentTarget));

/* ---------- 项目缓存（localStorage） ---------- */
const LS_KEY = "langSortTool.v1";

function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && Array.isArray(s.projects) && s.projects.length) return normalize(s);
  } catch (e) { /* 忽略损坏数据 */ }
  return null;
}
function saveStore() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch (e) { /* 隐私模式 / 超额时静默 */ }
}
function activeProj() {
  return store.projects.find(p => p.id === store.activeId) || store.projects[0];
}

// 补全旧数据缺失字段（如自定义 ID）
function normalize(s) {
  const used = new Set(s.projects.map(p => String(p.code)).filter(Boolean));
  let seq = Math.max(0, ...s.projects.map(p => Number(p.code)).filter(n => !isNaN(n)));
  s.projects.forEach(p => {
    if (!p.id) p.id = uid();
    if (p.code == null || String(p.code).trim() === "") {
      do { seq += 1; } while (used.has(String(seq).padStart(3, "0")));
      p.code = String(seq).padStart(3, "0"); used.add(p.code);
    }
    if (p.name == null) p.name = "";
    if (!p.date) p.date = todayStr();
    if (p.input == null) p.input = "";
  });
  if (!s.activeId || !s.projects.some(p => p.id === s.activeId)) s.activeId = s.projects[0].id;
  return s;
}

// 下一个自动 ID = 现有数字 ID 最大值 + 1（补零到 3 位）
function nextCode() {
  const nums = store.projects.map(p => Number(p.code)).filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return String(next).padStart(3, "0");
}
// 按 ID 倒序（最新/最大在上），数字感知比较，兼容 "20260612-01" 之类
function cmpCodeDesc(a, b) {
  return String(b.code).localeCompare(String(a.code), undefined, { numeric: true, sensitivity: "base" });
}

let store = loadStore();
if (!store) {
  const id = uid();
  store = { activeId: id, projects: [{ id, code: "001", name: "示例活动 Sample", date: todayStr(), input: DEFAULT_INPUT }] };
  saveStore();
}

/* ---------- 侧栏时间线 ---------- */
function renderProjFilter() {
  const sel = document.getElementById("projFilter");
  const cur = sel.value;
  const names = [...new Set(store.projects.map(p => p.name).filter(n => n && n.trim()))]
    .sort((a, b) => a.localeCompare(b));
  sel.innerHTML = '<option value="">全部项目</option>' +
    names.map(n => '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>').join("");
  sel.value = names.includes(cur) ? cur : "";
}
function sidebarItems() {
  const pf = document.getElementById("projFilter").value;
  const q = document.getElementById("search").value.trim().toLowerCase();
  return store.projects
    .filter(p => !pf || p.name === pf)
    .filter(p => !q || String(p.code).toLowerCase().includes(q) || (p.name || "").toLowerCase().includes(q))
    .sort(cmpCodeDesc);
}
function renderSidebar() {
  renderProjFilter();
  const host = document.getElementById("timeline");
  const items = sidebarItems();
  if (items.length === 0) {
    host.innerHTML = '<div class="sb-empty">没有匹配的活动。</div>';
    return;
  }
  host.innerHTML = items.map(p => {
    const active = p.id === store.activeId ? " active" : "";
    return '<div class="tl-item' + active + '" data-id="' + p.id + '">' +
      '<div class="tl-dot"></div>' +
      '<div class="tl-body">' +
        '<div class="tl-top"><span class="tl-code">#' + escapeHtml(String(p.code)) + '</span>' +
        '<span class="tl-date">' + escapeHtml(p.date || "") + '</span></div>' +
        '<div class="tl-name">' + escapeHtml(p.name || "未命名") + '</div>' +
      '</div>' +
      '<button class="tl-del" data-del="' + p.id + '" title="删除">×</button>' +
    '</div>';
  }).join("");
}

function loadActiveIntoUI() {
  const p = activeProj();
  store.activeId = p.id;
  document.getElementById("projCode").value = p.code || "";
  document.getElementById("projName").value = p.name || "";
  document.getElementById("projDate").value = p.date || todayStr();
  document.getElementById("src").value = p.input || "";
  renderSidebar();
  doParse();
}

function deleteProject(id) {
  const p = store.projects.find(x => x.id === id);
  if (!p) return;
  if (!confirm("删除活动「#" + p.code + " " + (p.name || "未命名") + "」？此操作无法撤销。")) return;
  const wasActive = id === store.activeId;
  store.projects = store.projects.filter(x => x.id !== id);
  if (store.projects.length === 0) {
    const nid = uid();
    store.projects.push({ id: nid, code: nextCode(), name: "新活动", date: todayStr(), input: "" });
    store.activeId = nid;
  } else if (wasActive) {
    store.activeId = [...store.projects].sort(cmpCodeDesc)[0].id; // 选最新的为当前
  }
  saveStore();
  loadActiveIntoUI();
}

/* ---------- 侧栏事件 ---------- */
document.getElementById("timeline").addEventListener("click", e => {
  const del = e.target.closest(".tl-del");
  if (del) { e.stopPropagation(); deleteProject(del.dataset.del); return; }
  const item = e.target.closest(".tl-item");
  if (!item || item.dataset.id === store.activeId) return;
  store.activeId = item.dataset.id;
  saveStore();
  loadActiveIntoUI();
});
document.getElementById("projFilter").addEventListener("change", renderSidebar);
document.getElementById("search").addEventListener("input", renderSidebar);

document.getElementById("newProj").addEventListener("click", () => {
  const p = { id: uid(), code: nextCode(), name: "新活动", date: todayStr(), input: "" };
  store.projects.push(p);
  store.activeId = p.id;
  saveStore();
  loadActiveIntoUI();
  const n = document.getElementById("projName");
  n.focus(); n.select();
});

/* ---------- 当前活动元信息 ---------- */
document.getElementById("projCode").addEventListener("change", e => {
  const val = e.target.value.trim();
  const p = activeProj();
  if (val === "") { toast("ID 不能为空"); e.target.value = p.code; return; }
  if (store.projects.some(x => x.id !== p.id && String(x.code) === val)) {
    toast("ID「" + val + "」已存在"); e.target.value = p.code; return;
  }
  p.code = val;
  renderSidebar();
  saveStore();
});
document.getElementById("projName").addEventListener("input", e => {
  activeProj().name = e.target.value;
  renderSidebar();
  scheduleSave();
});
document.getElementById("projDate").addEventListener("change", e => {
  activeProj().date = e.target.value;
  renderSidebar();
  saveStore();
});

/* ---------- 初始化 ---------- */
loadActiveIntoUI();
</script>
</body>
