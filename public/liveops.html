<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LiveOps 推广内容运营辅助</title>
<style>
/* ── Reset & Variables ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
:root{
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-bg:#EEF2FF;
  --success:#1B6E2E; --success-l:#2E9E4F; --success-bg:#DCFCE7;
  --warning:#B45309; --warning-bg:#FEF3C7;
  --danger:#B91C1C; --danger-bg:#FEE2E2;
  --neutral:#6B7280; --neutral-bg:#F3F4F6;
  --info:#1D4ED8; --info-bg:#DBEAFE;
  --bg:#F0F2F7; --surface:#FFFFFF; --border:#E5E7EB;
  --text:#111827; --text-2:#374151; --text-muted:#6B7280;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 12px rgba(0,0,0,.10);
  --shadow-lg:0 8px 24px rgba(0,0,0,.14);
  --radius:12px; --radius-sm:8px;
}
html,body{height:100%;font-family:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--text)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Layout ────────────────────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:#fff;border-right:1px solid #EAECEF;display:flex;flex-direction:column;z-index:100;box-shadow:1px 0 0 rgba(0,0,0,.02)}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #F1F5F9;font-size:14px;font-weight:700;color:#4F46E5;letter-spacing:-.2px}
.sidebar-brand-dot{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.sidebar-add{margin:14px 12px 8px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;background:#4F46E5;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(79,70,229,.18);transition:background .12s,transform .08s}
.sidebar-add:hover{background:#4338CA;box-shadow:0 2px 6px rgba(79,70,229,.28)}
.sidebar-add:active{transform:translateY(1px)}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:6px 8px;flex:1}
.sidebar-nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:#475569;font-size:13px;width:100%;text-align:left;cursor:pointer;transition:background .12s,color .12s}
.sidebar-nav-item:hover{background:#F8FAFC;color:#0F172A}
.sidebar-nav-item.active{background:#EEF2FF;color:#4F46E5;font-weight:600}
.sidebar-nav-icon{width:18px;height:18px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.sidebar-footer{padding:12px;border-top:1px solid #F1F5F9;font-size:11px;color:#94A3B8;line-height:1.5}
.sidebar-footer a{color:#4F46E5}

.main{margin-left:240px;flex:1;min-width:0;padding:24px 28px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.topbar .sub{color:var(--text-muted);font-size:12px;margin-top:2px}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ── Buttons ───────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{background:#F9FAFB;box-shadow:var(--shadow-sm)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#4F46E5;color:#fff;border-color:#4F46E5}
.btn-primary:hover{background:#4338CA;border-color:#4338CA}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:#F1F5F9}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#991B1B;border-color:#991B1B}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;width:30px;height:30px;justify-content:center}

/* ── Cards ─────────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h3{font-size:14px;font-weight:700;color:var(--text)}
.card-h .hint{font-size:11px;color:var(--text-muted)}
.card-tight{padding:14px 16px}

/* ── Forms ─────────────────────────────────────────────────────────── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--text-muted);margin-top:4px}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=url],.field textarea,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;transition:border-color .12s,box-shadow .12s;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:0}
.col-sm{flex:0 0 auto;min-width:120px}

/* ── Tabs / Mode Switch ────────────────────────────────────────────── */
.tabs{display:inline-flex;gap:4px;padding:3px;background:#F1F5F9;border-radius:9px}
.tab{padding:6px 14px;border:none;background:transparent;border-radius:7px;font-size:12px;font-weight:600;color:#64748B;cursor:pointer;transition:background .12s,color .12s}
.tab.active{background:#fff;color:#0F172A;box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ── Wizard Steps ──────────────────────────────────────────────────── */
.steps{display:flex;align-items:center;gap:0;margin-bottom:20px;padding:14px 18px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;color:#94A3B8;font-size:12px;white-space:nowrap}
.step-num{width:22px;height:22px;border-radius:50%;background:#F1F5F9;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#64748B;border:1px solid #E2E8F0}
.step.active{color:#4F46E5;font-weight:600}
.step.active .step-num{background:#4F46E5;color:#fff;border-color:#4F46E5}
.step.done{color:#10B981}
.step.done .step-num{background:#10B981;color:#fff;border-color:#10B981}
.step-sep{flex:1;height:1px;background:#E5E7EB;margin:0 10px;min-width:18px}

/* ── Upload Zone ───────────────────────────────────────────────────── */
.dropzone{border:2px dashed #CBD5E1;border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;background:#FAFBFC;transition:background .12s,border-color .12s}
.dropzone:hover,.dropzone.drag{border-color:#4F46E5;background:#EEF2FF}
.dropzone-icon{font-size:30px;margin-bottom:8px;color:#94A3B8}
.dropzone-text{font-size:13px;color:var(--text-2)}
.dropzone-hint{font-size:11px;color:var(--text-muted);margin-top:4px}
.preview-wrap{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.preview{position:relative;width:140px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.preview img{display:block;width:100%;height:90px;object-fit:cover}
.preview .meta{padding:6px 8px;font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.preview .remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}

/* ── Counter Bar ───────────────────────────────────────────────────── */
.counter{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);margin-top:6px}
.counter-bar{flex:1;height:5px;background:#F1F5F9;border-radius:3px;overflow:hidden;max-width:200px}
.counter-bar-fill{height:100%;background:#10B981;transition:width .15s,background .15s}
.counter.warn .counter-bar-fill{background:#F59E0B}
.counter.danger .counter-bar-fill{background:#EF4444}
.counter.warn{color:#B45309}
.counter.danger{color:#B91C1C;font-weight:600}

/* ── Risk badges ───────────────────────────────────────────────────── */
.risk-list{display:flex;flex-direction:column;gap:8px}
.risk-item{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12px}
.risk-item.high{background:#FEF2F2;border-color:#FECACA}
.risk-item.med{background:#FFFBEB;border-color:#FDE68A}
.risk-item.low{background:#F0F9FF;border-color:#BAE6FD}
.risk-item.ok{background:#F0FDF4;border-color:#BBF7D0;color:#166534}
.risk-badge{flex-shrink:0;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.3px;height:fit-content}
.risk-badge.high{background:#FEE2E2;color:#991B1B}
.risk-badge.med{background:#FEF3C7;color:#92400E}
.risk-badge.low{background:#DBEAFE;color:#1E40AF}
.risk-badge.ok{background:#D1FAE5;color:#065F46}
.risk-body{flex:1;line-height:1.5}
.risk-body strong{display:block;margin-bottom:2px;color:var(--text)}
.risk-body .quote{display:inline-block;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;margin:0 2px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}

/* ── Language chips ────────────────────────────────────────────────── */
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lang-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:var(--text-2);transition:all .12s}
.lang-chip:hover{border-color:#A5B4FC;background:#F5F7FF}
.lang-chip.selected{background:#EEF2FF;border-color:#4F46E5;color:#3730A3;font-weight:600}
.lang-chip input{margin:0}

/* ── Tables ────────────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.tbl th{background:#F8FAFC;font-size:11px;font-weight:700;color:#64748B;letter-spacing:.3px;text-transform:uppercase;position:sticky;top:0;z-index:1}
.tbl tr:hover td{background:#FAFBFC}
.tbl .tag{display:inline-block;padding:2px 7px;border-radius:5px;background:#EEF2FF;color:#4F46E5;font-size:11px;font-weight:600}
.tbl-empty{padding:40px;text-align:center;color:var(--text-muted);font-size:13px}
.tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.tbl-toolbar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FAFBFC}
.tbl-toolbar input[type=text]{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;width:200px;outline:none}
.tbl-toolbar input:focus{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.tbl-scroll{max-height:560px;overflow:auto}

/* ── Toast / Modal / Lightbox ──────────────────────────────────────── */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 14px;background:var(--text);color:#fff;border-radius:8px;font-size:12px;box-shadow:var(--shadow-lg);max-width:340px;line-height:1.4;animation:toast-in .2s}
@keyframes toast-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.toast-success{background:#065F46}
.toast-error{background:#991B1B}
.toast-warn{background:#92400E}

.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px}
.modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:15px;font-weight:700}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#FAFBFC}

/* ── KPI cards ─────────────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi-card .lab{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.kpi-card .val{font-size:24px;font-weight:700;color:var(--text);margin-top:4px;letter-spacing:-.5px}
.kpi-card .sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* ── Output / Preview pane ─────────────────────────────────────────── */
.lang-section{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:#fff;overflow:hidden}
.lang-section-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border)}
.lang-section-h .l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text)}
.lang-flag{font-size:14px}
.lang-section-b{padding:12px 14px}
.lang-section-b .field:last-child{margin-bottom:0}

/* ── Misc ──────────────────────────────────────────────────────────── */
.empty{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty .ic{font-size:42px;margin-bottom:10px;opacity:.6}
.empty .t{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.empty .d{font-size:12px;line-height:1.6;max-width:380px;margin:0 auto}
.divider{height:1px;background:var(--border);margin:14px 0}
.kbd{display:inline-block;padding:1px 6px;font-size:11px;background:#F1F5F9;border:1px solid #E2E8F0;border-bottom-width:2px;border-radius:4px;font-family:'SF Mono',Menlo,Consolas,monospace}
.muted{color:var(--text-muted)}
.tiny{font-size:11px}
.mono{font-family:'SF Mono',Menlo,Consolas,monospace}
.tag-pill{display:inline-block;padding:1px 7px;border-radius:10px;background:#EEF2FF;color:#4F46E5;font-size:11px;font-weight:600}
.tag-pill.gray{background:#F1F5F9;color:#475569}
.tag-pill.green{background:#DCFCE7;color:#166534}
.tag-pill.red{background:#FEE2E2;color:#991B1B}
.tag-pill.amber{background:#FEF3C7;color:#92400E}

.flex{display:flex;gap:10px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gap-sm{gap:6px}
.mt-sm{margin-top:8px}
.mt{margin-top:14px}
.mb-sm{margin-bottom:8px}
.mb{margin-bottom:14px}
.hidden{display:none !important}

/* glossary table inline edit */
.gloss-row input{width:100%;padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
.gloss-row input:hover{background:#F8FAFC}
.gloss-row input:focus{background:#fff;border-color:#4F46E5;box-shadow:0 0 0 2px rgba(79,70,229,.12);outline:none}

/* spinner */
.spin{width:14px;height:14px;border:2px solid #E5E7EB;border-top-color:#4F46E5;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:880px){
  .sidebar{transform:translateX(-240px);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-brand-dot">L</span>
      <span>LiveOps 推广内容</span>
    </div>
    <button class="sidebar-add" data-go="new">＋ 新建活动</button>
    <nav class="sidebar-nav">
      <button class="sidebar-nav-item" data-go="new"><span class="sidebar-nav-icon">📝</span>新建活动</button>
      <button class="sidebar-nav-item" data-go="list"><span class="sidebar-nav-icon">📋</span>活动记录</button>
      <button class="sidebar-nav-item" data-go="dashboard"><span class="sidebar-nav-icon">📊</span>数据看板</button>
      <button class="sidebar-nav-item" data-go="glossary"><span class="sidebar-nav-icon">📖</span>术语库</button>
      <button class="sidebar-nav-item" data-go="settings"><span class="sidebar-nav-icon">⚙️</span>设置</button>
    </nav>
    <div class="sidebar-footer">
      <div><strong>官方文档</strong></div>
      <div><a href="https://support.google.com/googleplay/android-developer/answer/12929029?hl=zh-Hans" target="_blank">推广内容介绍</a></div>
      <div><a href="https://support.google.com/googleplay/android-developer/answer/12929944?hl=zh-Hans" target="_blank">内容质量指南</a></div>
      <div><a href="https://support.google.com/googleplay/android-developer/answer/12932541?hl=zh-Hans" target="_blank">创建推广内容</a></div>
      <div><a href="https://support.google.com/googleplay/android-developer/answer/12932123?hl=zh-Hans" target="_blank">驳回与修正</a></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════
// 0. CONSTANTS — Google Play LiveOps standards & rules
// ════════════════════════════════════════════════════════════════════

// 谷歌官方支持的语言代码（推广内容常用 25 种）
const LANG_LIST = [
  { code: 'en-US', flag: '🇺🇸', name: 'English (US)',     short: 'EN-US', latin: true },
  { code: 'en-GB', flag: '🇬🇧', name: 'English (UK)',     short: 'EN-GB', latin: true },
  { code: 'zh-CN', flag: '🇨🇳', name: '简体中文',           short: '简中',  latin: false },
  { code: 'zh-TW', flag: '🇹🇼', name: '繁体中文（台湾）',   short: '繁中',  latin: false },
  { code: 'zh-HK', flag: '🇭🇰', name: '繁体中文（香港）',   short: '繁港',  latin: false },
  { code: 'ja-JP', flag: '🇯🇵', name: '日本語',             short: 'JP',    latin: false },
  { code: 'ko-KR', flag: '🇰🇷', name: '한국어',              short: 'KR',    latin: false },
  { code: 'de-DE', flag: '🇩🇪', name: 'Deutsch',            short: 'DE',    latin: true },
  { code: 'fr-FR', flag: '🇫🇷', name: 'Français',           short: 'FR',    latin: true },
  { code: 'es-ES', flag: '🇪🇸', name: 'Español (ES)',       short: 'ES',    latin: true },
  { code: 'es-419',flag: '🌎', name: 'Español (Latam)',    short: 'ES-LA', latin: true },
  { code: 'pt-BR', flag: '🇧🇷', name: 'Português (Brasil)',short: 'PT-BR', latin: true },
  { code: 'pt-PT', flag: '🇵🇹', name: 'Português (PT)',    short: 'PT-PT', latin: true },
  { code: 'ru-RU', flag: '🇷🇺', name: 'Русский',            short: 'RU',    latin: false },
  { code: 'it-IT', flag: '🇮🇹', name: 'Italiano',           short: 'IT',    latin: true },
  { code: 'nl-NL', flag: '🇳🇱', name: 'Nederlands',         short: 'NL',    latin: true },
  { code: 'pl-PL', flag: '🇵🇱', name: 'Polski',             short: 'PL',    latin: true },
  { code: 'tr-TR', flag: '🇹🇷', name: 'Türkçe',             short: 'TR',    latin: true },
  { code: 'ar',    flag: '🇸🇦', name: 'العربية',            short: 'AR',    latin: false },
  { code: 'hi-IN', flag: '🇮🇳', name: 'हिन्दी',              short: 'HI',    latin: false },
  { code: 'id',    flag: '🇮🇩', name: 'Bahasa Indonesia',   short: 'ID',    latin: true },
  { code: 'th',    flag: '🇹🇭', name: 'ภาษาไทย',            short: 'TH',    latin: false },
  { code: 'vi',    flag: '🇻🇳', name: 'Tiếng Việt',         short: 'VI',    latin: true },

// 1. IndexedDB — 活动 / 设置 / 词库 / 历史
// ════════════════════════════════════════════════════════════════════
const IDB_NAME = 'liveops';
const IDB_VER  = 1;
function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('activities')) db.createObjectStore('activities', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('settings'))   db.createObjectStore('settings');
      if (!db.objectStoreNames.contains('glossary'))   db.createObjectStore('glossary', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}
async function idbAll(store) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly').objectStore(store).getAll();
    tx.onsuccess = () => res(tx.result || []);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(store, key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly').objectStore(store).get(key);
    tx.onsuccess = () => res(tx.result);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbPut(store, value, key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const s = db.transaction(store, 'readwrite').objectStore(store);
    const tx = key === undefined ? s.put(value) : s.put(value, key);
    tx.onsuccess = () => res(tx.result);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDel(store, key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    tx.onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

// 3. Char counting — 谷歌字符规则（按 grapheme，emoji=1）
// ════════════════════════════════════════════════════════════════════
const SEG = (typeof Intl !== 'undefined' && Intl.Segmenter)
  ? new Intl.Segmenter('und', { granularity: 'grapheme' })
  : null;
function charCount(str) {
  if (!str) return 0;
  if (SEG) {
    let n = 0;
    for (const _ of SEG.segment(str)) n++;
    return n;
  }
  return [...str].length;
}
function trimToLimit(str, limit) {
  if (charCount(str) <= limit) return str;
  if (SEG) {
    let n = 0, last = 0;
    for (const seg of SEG.segment(str)) {
      if (n + 1 > limit) break;
      n++; last = seg.index + seg.segment.length;
    }
    return str.slice(0, last);
  }
  return [...str].slice(0, limit).join('');
}

// ════════════════════════════════════════════════════════════════════
// 4. Red-line scanner — 规则扫描，返回结构化报告
// ════════════════════════════════════════════════════════════════════
function scanRedLines(text, scope) {
  if (!text) return [];
  const hits = [];
  for (const rule of RED_LINE_RULES) {
    if (rule.scope && rule.scope !== scope) continue;
    const matches = new Set();
    for (const p of rule.patterns) {
      const re = new RegExp(p.source, p.flags.includes('g') ? p.flags : p.flags + 'g');
      let m;
      while ((m = re.exec(text)) !== null) {
        matches.add(m[0]);
        if (!re.global) break;
      }
    }
    if (matches.size) {
      hits.push({ id: rule.id, level: rule.level, tag: rule.tag, why: rule.why, samples: [...matches].slice(0, 5) });
    }
  }
  return hits;
}
function maxRiskLevel(hits) {
  if (hits.some(h => h.level === 'high')) return 'high';
  if (hits.some(h => h.level === 'med'))  return 'med';
  if (hits.some(h => h.level === 'low'))  return 'low';
  return 'ok';
}

// 5. Gemini API client
// ════════════════════════════════════════════════════════════════════
async function geminiCall({ apiKey, model, prompt, image, schema, temperature = 0.7 }) {
  if (!apiKey) throw new Error('未设置 Gemini API Key，请先到「设置」页填入');
  const parts = [];
  if (image && image.data) {
    parts.push({ inline_data: { mime_type: image.mime || 'image/jpeg', data: image.data } });
  }
  parts.push({ text: prompt });
  const body = {
    contents: [{ role: 'user', parts }],
    generationConfig: {
      temperature,
      ...(schema ? { responseMimeType: 'application/json', responseSchema: schema } : {})
    }
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  let resp;
  try {
    resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new Error('网络错误：' + e.message);
  }
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).error?.message || ''; } catch {}
    throw new Error(`Gemini API ${resp.status}：${detail || resp.statusText}`);
  }
  const json = await resp.json();
  const text = json.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  if (!text) {
    const reason = json.candidates?.[0]?.finishReason || json.promptFeedback?.blockReason || '空响应';
    throw new Error('Gemini 没有返回有效内容（' + reason + '）');
  }
  if (schema) {
    try { return JSON.parse(text); }
    catch (e) {
      // 容错：模型偶尔包 ```json``` fence
      const stripped = text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
      try { return JSON.parse(stripped); }
      catch { throw new Error('Gemini 返回了非 JSON：' + text.slice(0, 200)); }
    }
  }
  return text;
}

// 步骤 3：自动精简（仅在超字数时调用）
async function aiTrim({ settings, text, limit, kind, lang }) {
  const langName = LANG_BY_CODE[lang]?.name || lang;
  const kindName = kind === 'tagline' ? '宣传口号' : '长说明';
  const prompt = `下面这段 Google Play ${kindName}（${langName}）超过了 ${limit} 字符上限（当前 ${charCount(text)} 字符）。请在保留全部关键信息与卖点的前提下精简到 ${limit} 字符以内，**严禁**新增 CTA、价格、绝对化用语。只返回精简后的纯文本，不要解释。

原文：${text}`;
  const out = await geminiCall({ apiKey: settings.apiKey, model: settings.model, prompt, temperature: 0.5 });
  return out.trim().replace(/^["「『]|["」』]$/g, '');
}

function csvEscape(v) {
  if (v == null) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function buildCSV(rows) {
  const out = [CSV_HEADERS.join(',')];
  for (const r of rows) out.push(CSV_HEADERS.map(h => csvEscape(r[h])).join(','));
  return '﻿' + out.join('\r\n'); // 加 BOM 让 Excel 识别 UTF-8
}
function downloadFile(name, content, mime = 'text/csv;charset=utf-8') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200);
}

// 7. UI helpers
// ════════════════════════════════════════════════════════════════════
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return [...root.querySelectorAll(sel)]; }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uuid() { return 'a' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function fmtTime(ts) { if (!ts) return '—'; const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

function toast(msg, type = 'info') {
  let c = $('#toast-container');
  if (!c) { c = el('div', { id: 'toast-container', class: 'toast-container' }); document.body.appendChild(c); }
  const t = el('div', { class: `toast toast-${type}` }, msg);
  c.appendChild(t);
  setTimeout(() => t.remove(), 3800);
}

function confirmModal({ title, body, okText = '确认', okClass = 'btn-primary' }) {
  return new Promise(resolve => {
    const mask = el('div', { class: 'modal-mask', onclick: e => { if (e.target === mask) { mask.remove(); resolve(false); } } });
    const modal = el('div', { class: 'modal' });
    modal.appendChild(el('div', { class: 'modal-h' }, el('h3', {}, title), el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { mask.remove(); resolve(false); } }, '✕')));
    modal.appendChild(el('div', { class: 'modal-b', html: body }));
    const f = el('div', { class: 'modal-f' });
    f.append(
      el('button', { class: 'btn', onclick: () => { mask.remove(); resolve(false); } }, '取消'),
      el('button', { class: `btn ${okClass}`, onclick: () => { mask.remove(); resolve(true); } }, okText),
    );
    modal.appendChild(f);
    mask.appendChild(modal);
    document.body.appendChild(mask);
  });
}

// 压缩图片为 base64（用于发给 Gemini 节省带宽）
function fileToCompressedBase64(file, maxPx = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const ratio = Math.min(maxPx / img.width, maxPx / img.height, 1);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const data = canvas.toDataURL('image/jpeg', quality);
      resolve({ mime: 'image/jpeg', dataUrl: data, data: data.split(',')[1] });
    };
    img.onerror = e => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}

function refreshCounter(prefix, text, limit) {
  const n = charCount(text);
  const fill = $('#cnt-' + prefix + '-fill');
  const num = $('#cnt-' + prefix + '-num');
  const wrap = $('#cnt-' + prefix);
  if (!fill || !num || !wrap) return;
  const pct = Math.min(100, Math.round(n / limit * 100));
  fill.style.width = pct + '%';
  num.textContent = `${n} / ${limit}`;
  wrap.classList.remove('warn','danger');
  if (n > limit) wrap.classList.add('danger');
  else if (n > limit * 0.9) wrap.classList.add('warn');
}

function recomputeRisks(rec) {
  return {
    tagline: scanRedLines(rec.tagline || '', 'tagline'),
    description: scanRedLines(rec.description || '', 'description'),
  };

async function runLocalize() {
  const w = state.wiz;
  if (!w.selectedLangs.length) { toast('请先选择目标语言', 'error'); return; }
  if (!w.tagline || !w.description) { toast('请确保 Tagline / Description 已填', 'error'); return; }

  const root = $('#main');
  const loading = el('div', { class: 'card' });
  loading.append(el('div', { class: 'card-h' }, el('h3', {}, '本地化中…'), el('div', { class: 'tiny muted' }, state.settings.apiKey ? state.settings.model : '无 API Key — 跳过翻译')));
  loading.append(el('div', { class: 'flex', style: { padding: '14px 0' } }, el('span', { class: 'spin' }), el('span', {}, `共 ${w.selectedLangs.length} 种语言`)));
  root.append(loading);

  try {
    let results;
    if (state.settings.apiKey) {
      const r = await aiLocalize({
        settings: state.settings,
        sourceLang: w.sourceLang,
        tagline: w.tagline,
        description: w.description,
        targets: w.selectedLangs,
        glossary: state.glossary,
      });
      results = r.results || [];
    } else {
      results = w.selectedLangs.map(code => ({ code, tagline: `[${code}] ${w.tagline}`, description: `[${code}] ${w.description}` }));
    }
    // 兜底字符限：模型偶尔不守限，本地截
    const localized = {};
    for (const r of results) {
      let tg = r.tagline || ''; let ds = r.description || '';
      if (charCount(tg) > LIMIT.tagline && state.settings.apiKey) {
        try { tg = await aiTrim({ settings: state.settings, text: tg, limit: LIMIT.tagline, kind: 'tagline', lang: r.code }); } catch {}
      }
      if (charCount(tg) > LIMIT.tagline) tg = trimToLimit(tg, LIMIT.tagline);
      if (charCount(ds) > LIMIT.description && state.settings.apiKey) {
        try { ds = await aiTrim({ settings: state.settings, text: ds, limit: LIMIT.description, kind: 'description', lang: r.code }); } catch {}
      }
      if (charCount(ds) > LIMIT.description) ds = trimToLimit(ds, LIMIT.description);
      localized[r.code] = { tagline: tg, description: ds, risks: recomputeRisks({ tagline: tg, description: ds }) };
    }
    w.localized = localized;
    render();
  } catch (e) {
    toast('翻译失败：' + e.message, 'error');
    render();
  }
}

function kpiCard(label, val, sub) {
  return el('div', { class: 'kpi-card' },
    el('div', { class: 'lab' }, label),
    el('div', { class: 'val' }, String(val)),
    el('div', { class: 'sub' }, sub || ''),
  );
}
function aggregateKPI(list) {
  const num = v => { const n = parseFloat(String(v||'').replace(/,/g,'')); return isFinite(n) ? n : 0; };
  let imp = 0, ins = 0, cvrSum = 0, cvrN = 0, d1Sum = 0, d1N = 0, d7Sum = 0, d7N = 0;
  for (const a of list) {
    const k = a.kpi || {};
    imp += num(k.impressions); ins += num(k.installs);
    if (k.storeCvr) { cvrSum += num(k.storeCvr); cvrN++; }
    if (k.d1) { d1Sum += num(k.d1); d1N++; }
    if (k.d7) { d7Sum += num(k.d7); d7N++; }
  }
  return {
    impressions: imp ? imp.toLocaleString() : 0,
    installs:    ins ? ins.toLocaleString() : 0,
    avgCvr: cvrN ? (cvrSum/cvrN).toFixed(2) : '',
    avgD1:  d1N  ? (d1Sum/d1N).toFixed(1)  : '',
    avgD7:  d7N  ? (d7Sum/d7N).toFixed(1)  : '',
  };
}

function importGlossary() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const txt = await f.text();
      const arr = JSON.parse(txt);
      if (!Array.isArray(arr)) throw new Error('不是数组');
      for (const g of arr) {
        const copy = { ...g }; delete copy.id;
        await idbPut('glossary', copy);
      }
      state.glossary = await idbAll('glossary');
      toast(`已导入 ${arr.length} 条`, 'success');
      render();
    } catch (e) { toast('导入失败：' + e.message, 'error'); }
  };
  inp.click();
}

      for (const a of state.activities) await idbDel('activities', a.id);
      for (const g of state.glossary) await idbDel('glossary', g.id);
      state.activities = []; state.glossary = [];
      await seedGlossaryIfEmpty(); state.glossary = await idbAll('glossary');
      toast('已清空', 'success'); render();
    }}, '✕ 清空数据'),
  ));
  root.append(dataCard);
}
function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (Array.isArray(data.activities)) for (const a of data.activities) await idbPut('activities', a);
      if (Array.isArray(data.glossary))   for (const g of data.glossary)   { const c={...g}; delete c.id; await idbPut('glossary', c); }
      state.activities = await idbAll('activities');
      state.glossary = await idbAll('glossary');
      toast('恢复完成', 'success'); render();
    } catch (e) { toast('恢复失败：' + e.message, 'error'); }
  };
  inp.click();
}

// ════════════════════════════════════════════════════════════════════
// 14. boot
// ════════════════════════════════════════════════════════════════════
window.addEventListener('hashchange', () => go(location.hash.replace('#','') || 'new'));
bootstrap().catch(e => {
  document.body.innerHTML = '<div style="padding:40px;color:#B91C1C">启动失败：' + esc(e.message) + '</div>';
  console.error(e);
});
</script>
